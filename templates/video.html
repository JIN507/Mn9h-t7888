{% extends 'base.html' %}

{% block content %}
<div class="row">
    <div class="col-md-8 mx-auto">
        <div class="card shadow-sm mb-4">
            <div class="card-header bg-primary text-white">
                <h2 class="h4 mb-0">البحث باستخدام الفيديو</h2>
            </div>
            <div class="card-body">
                <form id="video-upload-form" class="text-center p-3" enctype="multipart/form-data">
                    <div class="mb-4">
                        <div class="upload-area border border-2 rounded p-5 mb-3" id="video-drop-area">
                            <img src="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/icons/film.svg" alt="Upload Video" style="width: 64px; height: 64px;" class="mb-3">
                            <h3 class="h5">اسحب وأفلت ملف الفيديو هنا أو انقر للاختيار</h3>
                            <input type="file" id="video-file-input" class="d-none" accept="video/*">
                            <button type="button" id="select-video-btn" class="btn btn-outline-primary mt-2">اختر فيديو</button>
                        </div>
                        <div id="video-preview-container" class="d-none text-center">
                            <video id="video-preview" class="img-fluid border rounded mb-3" style="max-height: 300px;" controls></video>
                            <div>
                                <button type="button" id="remove-video-btn" class="btn btn-outline-danger btn-sm">إزالة الفيديو</button>
                            </div>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="frame-interval" class="form-label">الفاصل الزمني بين الإطارات (ثواني):</label>
                        <input type="range" class="form-range" id="frame-interval" min="1" max="10" value="2">
                        <span id="frame-interval-value">2</span>
                    </div>
                    <button type="submit" id="extract-btn" class="btn btn-primary btn-lg px-4">استخراج الإطارات <i class="bi bi-camera"></i></button>
                </form>
            </div>
        </div>
        
        <div id="frames-container" class="d-none">
            <div class="card shadow-sm mb-4">
                <div class="card-header bg-success text-white">
                    <h2 class="h4 mb-0">الإطارات المستخرجة</h2>
                </div>
                <div class="card-body">
                    <div id="frames-grid" class="row row-cols-1 row-cols-md-3 g-4"></div>
                </div>
            </div>
        </div>
        
        <div id="video-loading-indicator" class="text-center d-none">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">جاري التحميل...</span>
            </div>
            <p class="mt-2">جاري استخراج الإطارات من الفيديو...</p>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    document.addEventListener('DOMContentLoaded', function() {
        // Constants and elements
        const videoUploadForm = document.getElementById('video-upload-form');
        const videoDropArea = document.getElementById('video-drop-area');
        const videoFileInput = document.getElementById('video-file-input');
        const selectVideoBtn = document.getElementById('select-video-btn');
        const videoPreview = document.getElementById('video-preview');
        const videoPreviewContainer = document.getElementById('video-preview-container');
        const removeVideoBtn = document.getElementById('remove-video-btn');
        const extractBtn = document.getElementById('extract-btn');
        const framesContainer = document.getElementById('frames-container');
        const framesGrid = document.getElementById('frames-grid');
        const videoLoadingIndicator = document.getElementById('video-loading-indicator');
        const frameInterval = document.getElementById('frame-interval');
        const frameIntervalValue = document.getElementById('frame-interval-value');
        
        // Update frame interval value
        frameInterval.addEventListener('input', () => {
            frameIntervalValue.textContent = frameInterval.value;
        });
        
        // Handle file selection via button
        selectVideoBtn.addEventListener('click', () => {
            videoFileInput.click();
        });
        
        // Handle file selection
        videoFileInput.addEventListener('change', handleVideoSelect);
        
        // Handle drag and drop
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            videoDropArea.addEventListener(eventName, preventDefaults, false);
        });
        
        ['dragenter', 'dragover'].forEach(eventName => {
            videoDropArea.addEventListener(eventName, highlightVideo, false);
        });
        
        ['dragleave', 'drop'].forEach(eventName => {
            videoDropArea.addEventListener(eventName, unhighlightVideo, false);
        });
        
        videoDropArea.addEventListener('drop', handleVideoDrop, false);
        
        // Handle remove video
        removeVideoBtn.addEventListener('click', () => {
            videoFileInput.value = null;
            videoPreviewContainer.classList.add('d-none');
            videoDropArea.classList.remove('d-none');
            framesContainer.classList.add('d-none');
            videoPreview.src = '';
        });
        
        // Handle form submission
        videoUploadForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!videoFileInput.files[0]) {
                alert('الرجاء اختيار فيديو أولاً');
                return;
            }
            
            // Show loading indicator
            videoLoadingIndicator.classList.remove('d-none');
            extractBtn.disabled = true;
            
            try {
                const formData = new FormData();
                formData.append('file', videoFileInput.files[0]);
                formData.append('frameInterval', frameInterval.value);
                
                const response = await fetch('/api/extract-frames', {
                    method: 'POST',
                    body: formData
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                
                // Display the extracted frames
                displayFrames(data.frames);
                
                // Hide loading and show frames
                videoLoadingIndicator.classList.add('d-none');
                framesContainer.classList.remove('d-none');
                extractBtn.disabled = false;
            } catch (error) {
                console.error('Error:', error);
                alert(`حدث خطأ: ${error.message}`);
                videoLoadingIndicator.classList.add('d-none');
                extractBtn.disabled = false;
            }
        });
        
        // Function to handle video selection
        function handleVideoSelect(e) {
            const file = e.target.files[0];
            if (file && isValidVideoFile(file)) {
                displayVideoPreview(file);
            }
        }
        
        // Function to handle drop
        function handleVideoDrop(e) {
            const dt = e.dataTransfer;
            const file = dt.files[0];
            
            if (file && isValidVideoFile(file)) {
                videoFileInput.files = dt.files;
                displayVideoPreview(file);
            }
        }
        
        // Check if file is a valid video
        function isValidVideoFile(file) {
            const validTypes = ['video/mp4', 'video/webm', 'video/ogg', 'video/quicktime'];
            if (!validTypes.includes(file.type)) {
                alert('الرجاء اختيار ملف فيديو صالح (MP4, WebM, etc.)');
                return false;
            }
            return true;
        }
        
        // Display video preview
        function displayVideoPreview(file) {
            const url = URL.createObjectURL(file);
            videoPreview.src = url;
            videoPreviewContainer.classList.remove('d-none');
            videoDropArea.classList.add('d-none');
        }
        
        // Display extracted frames
        function displayFrames(frames) {
            framesGrid.innerHTML = '';
            
            frames.forEach((frame, index) => {
                const col = document.createElement('div');
                col.className = 'col';
                
                const card = document.createElement('div');
                card.className = 'card h-100';
                
                const img = document.createElement('img');
                img.src = frame.data;
                img.className = 'card-img-top';
                img.alt = `Frame ${index + 1}`;
                
                const cardBody = document.createElement('div');
                cardBody.className = 'card-body';
                
                const title = document.createElement('h5');
                title.className = 'card-title';
                title.textContent = `الإطار ${index + 1}`;
                
                const time = document.createElement('p');
                time.className = 'card-text';
                time.textContent = `الوقت: ${frame.timestamp.toFixed(2)} ثانية`;
                
                const searchBtn = document.createElement('button');
                searchBtn.className = 'btn btn-primary me-2';
                searchBtn.textContent = 'البحث بهذا الإطار';
                searchBtn.onclick = () => searchWithFrame(frame.data);
                
                // Add AI detection button
                const detectAiBtn = document.createElement('button');
                detectAiBtn.className = 'btn btn-success me-2';
                detectAiBtn.textContent = 'فحص بالذكاء الاصطناعي';
                detectAiBtn.onclick = () => sendToAiDetection(frame.data);
                
                // Add image source search button
                const sourceSearchBtn = document.createElement('button');
                sourceSearchBtn.className = 'btn btn-info mt-2';
                sourceSearchBtn.textContent = 'البحث عن مصدر هذه الصورة';
                sourceSearchBtn.onclick = () => searchForImageSource(frame.data);
                
                cardBody.appendChild(title);
                cardBody.appendChild(time);
                cardBody.appendChild(searchBtn);
                cardBody.appendChild(detectAiBtn);
                cardBody.appendChild(sourceSearchBtn);
                
                card.appendChild(img);
                card.appendChild(cardBody);
                
                col.appendChild(card);
                framesGrid.appendChild(col);
            });
        }
        
        // Send frame to AI detection page
        function sendToAiDetection(imageData) {
            // Store the image data in localStorage using the correct key expected by ai_detection.html
            localStorage.setItem('pendingAiDetectionImage', imageData);
            // Also set uploadedImage for compatibility
            localStorage.setItem('uploadedImage', imageData);
            // Navigate to AI detection page
            window.location.href = '/ai-detection';
        }
        
        // Send frame to image source search page
        function searchForImageSource(imageData) {
            // الطريقة المباشرة: تخزين الصورة في localStorage وتحويل المستخدم مباشرة
            // تخزين بيانات الصورة في localStorage
            localStorage.setItem('pendingImageSourceSearch', imageData);
            
            // الانتقال إلى صفحة البحث عن مصدر الصورة
            window.location.href = '/image-source-search?from=video';
        }
        
        // Search with a specific frame
        async function searchWithFrame(imageData) {
            try {
                // Show loading indicator
                videoLoadingIndicator.classList.remove('d-none');
                
                const response = await fetch('/api/upload', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: `image=${encodeURIComponent(imageData)}`
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                
                // Hide loading indicator
                videoLoadingIndicator.classList.add('d-none');
                
                // Open a new window/tab with the search results
                const searchWindow = window.open('', '_blank');
                searchWindow.document.write(`
                    <html dir="rtl" lang="ar">
                    <head>
                        <title>نتائج البحث بالإطار - باحث الصور</title>
                        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
                    </head>
                    <body>
                        <div class="container my-4">
                            <h1>نتائج البحث بالإطار</h1>
                            <div class="row mb-4">
                                <div class="col-md-4">
                                    <img src="${data.imageUrl}" class="img-fluid border rounded" alt="Searched Frame">
                                </div>
                                <div class="col-md-8">
                                    <h2>روابط البحث</h2>
                                    <ul class="list-group">
                                        <li class="list-group-item">
                                            <a href="${data.searchResults.google}" target="_blank" class="btn btn-primary">Google بحث</a>
                                        </li>
                                        <li class="list-group-item">
                                            <a href="${data.searchResults.bing}" target="_blank" class="btn btn-primary">Bing بحث</a>
                                        </li>
                                        <li class="list-group-item">
                                            <a href="${data.searchResults.yandex}" target="_blank" class="btn btn-primary">Yandex بحث</a>
                                        </li>
                                        <li class="list-group-item">
                                            <a href="${data.searchResults.tineye}" target="_blank" class="btn btn-primary">TinEye بحث</a>
                                        </li>
                                    </ul>
                                </div>
                            </div>
                            <button class="btn btn-secondary" onclick="window.close()">إغلاق</button>
                        </div>
                    </body>
                    </html>
                `);
                searchWindow.document.close();
            } catch (error) {
                console.error('Error:', error);
                alert(`حدث خطأ: ${error.message}`);
                videoLoadingIndicator.classList.add('d-none');
            }
        }
        
        // Utility functions
        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }
        
        function highlightVideo() {
            videoDropArea.classList.add('border-primary');
        }
        
        function unhighlightVideo() {
            videoDropArea.classList.remove('border-primary');
        }
    });
</script>
{% endblock %}
