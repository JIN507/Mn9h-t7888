# Seed regression set for the origin feature. Images live in the private R2
# bucket (key = the upload path); the runner turns keys into public URLs.
# expected     : the true first publication (what a perfect run returns)
# acceptable   : other page-verified answers that are correct for the
#                photograph (e.g. a later confirmed repost when Google does not
#                surface the original that call)
# reachable    : "always" | "sometimes" — whether our engines can reach `expected`
cases:
  - id: maersk_frankfurt
    key: uploads/31dcca1ea231482b91513f32158b3325.jpg
    kind: image
    expected: https://x.com/IndiaCoastGuard/status/1814337329387175999
    expected_date: "2024-07-19T16:31:42Z"
    reachable: always
    notes: Indian Coast Guard photo of the Maersk Frankfurt fire; news copies within hours.

  - id: singers_restored
    key: uploads/9ef957c452e04b3f9035b898a066752f.jpg
    kind: image
    expected: https://x.com/svs9111/status/570514380095299584
    expected_date: "2015-02-25T09:23:22Z"
    acceptable:
      - https://x.com/0fj/status/1234717126671425537
    reachable: sometimes
    notes: AI-restored/outpainted copy of a 2015 scan; Google's fetcher refuses the file.

  - id: abha_airport_frame
    key: uploads/fa90eccf14e2485584cdf36e7faa468a.jpg
    kind: image
    expected: https://t.me/s/sharyemeny?before=18194
    expected_date: "2026-02-09T19:24:32Z"
    reachable: always
    notes: frame of the Abha airport clip; Telegram channel post.

  - id: instagram_screenshot
    key: uploads/11e5f8db75ac422f96432b8b2eb43371.jpg
    kind: image
    expected: https://www.facebook.com/groups/1362264327769433/posts/1485484632114068/
    expected_date: "2024-12-06T04:08:31Z"
    reachable: always
    notes: phone screenshot of an Instagram post; the photo must be cropped out first.

  - id: bus_fire_frame
    key: uploads/fd4c2650b3ff48b69141c537e40c5ece.jpg
    kind: image
    expected: https://x.com/anesmansory/status/1855747417544773860
    expected_date: "2024-11-10T23:00:37Z"
    reachable: always
    notes: single frame of a video; other frames appear earlier the same day on sabq.org.
