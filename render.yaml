databases:
  - name: bahith-db
    databaseName: bahith
    user: bahith_user
    plan: free

services:
  - type: redis
    name: bahith-redis
    plan: free
    ipAllowList: []  # internal access only

  - type: web
    name: bahith-al-suwar
    env: python
    buildCommand: "./build.sh"
    startCommand: bash -c "flask db upgrade && gunicorn app:app"
    envVars:
      # Database - auto-populated from Render Postgres
      - key: DATABASE_URL
        fromDatabase:
          name: bahith-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: bahith-redis
          property: connectionString
      # Security - auto-generated secret
      - key: SECRET_KEY
        generateValue: true
      # Admin Bootstrap (set in Render dashboard - not synced)
      - key: ADMIN_EMAIL
        value: admin@tahaqaq.sa
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: مسؤول النظام
      # Existing config
      - key: USER_DATA_PATH
        value: /tmp/user_data
      - key: USER_DATA_DASH_PATH
        value: /tmp/user-data
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: IMGBB_API_KEY
        sync: false
      - key: SIGHTENGINE_API_USER
        sync: false
      - key: SIGHTENGINE_API_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
    autoDeploy: true

  - type: worker
    name: bahith-worker
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python worker.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bahith-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: bahith-redis
          property: connectionString
      - key: SECRET_KEY
        sync: false
      - key: AIORNOT_API_KEY
        sync: false
      - key: SERPAPI_API_KEY
        sync: false
      - key: ZENSERP_API_KEY
        sync: false
      - key: XAI_API_KEY
        sync: false
      - key: SIGHTENGINE_API_USER
        sync: false
      - key: SIGHTENGINE_API_SECRET
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: IMGBB_API_KEY
        sync: false
    autoDeploy: true
