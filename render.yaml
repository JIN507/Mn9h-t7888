services:
  - type: web
    name: bahith-al-suwar
    env: python
    buildCommand: |
      apt-get update && apt-get install -y wget unzip
      # Create chromium directory
      mkdir -p /app/chromium
      # Download chromium zip from AWS S3
      wget -O chromium.zip "https://s3.eu-north-1.amazonaws.com/chromium.file/chromium.zip"
      # Unzip to the chromium directory
      unzip -o chromium.zip -d /app/chromium/
      # Make chrome executable (if needed)
      chmod +x /app/chromium/chrome-linux/chrome
      # Install Python dependencies
      pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: IMGBB_API_KEY
        value: 8a0183d939bb1db66e0e505b80c758e6
      - key: PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH
        value: /app/chromium/chrome-linux/chrome
    autoDeploy: true
